services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - api_blue
      - api_green
    restart: unless-stopped

  api_blue:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: demi-api:blue
    env_file:
      - .env
    environment:
      - MAIN_DB_SUPABASE_URL=${MAIN_DB_SUPABASE_URL:-}
      - MAIN_DB_SUPABASE_SERVICE_KEY=${MAIN_DB_SUPABASE_SERVICE_KEY:-}
      - AGENT_RUNTIME=${AGENT_RUNTIME:-docker}
      - API_EMBEDDED_WORKERS_ENABLED=false
      - EVENTS_WORKER_ENABLED=false
      - PENDING_WORKER_ENABLED=false
      - OUTBOX_WORKER_ENABLED=false
    volumes:
      - ${HOST_DATA_PATH:-./data}:${CONTAINER_DATA_PATH:-/app/data}
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  api_green:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: demi-api:green
    env_file:
      - .env
    environment:
      - MAIN_DB_SUPABASE_URL=${MAIN_DB_SUPABASE_URL:-}
      - MAIN_DB_SUPABASE_SERVICE_KEY=${MAIN_DB_SUPABASE_SERVICE_KEY:-}
      - AGENT_RUNTIME=${AGENT_RUNTIME:-docker}
      - API_EMBEDDED_WORKERS_ENABLED=false
      - EVENTS_WORKER_ENABLED=false
      - PENDING_WORKER_ENABLED=false
      - OUTBOX_WORKER_ENABLED=false
    volumes:
      - ${HOST_DATA_PATH:-./data}:${CONTAINER_DATA_PATH:-/app/data}
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: demi-worker:latest
    env_file:
      - .env
    environment:
      - MAIN_DB_SUPABASE_URL=${MAIN_DB_SUPABASE_URL:-}
      - MAIN_DB_SUPABASE_SERVICE_KEY=${MAIN_DB_SUPABASE_SERVICE_KEY:-}
      - AGENT_RUNTIME=${AGENT_RUNTIME:-docker}
      - API_EMBEDDED_WORKERS_ENABLED=true
      - EVENTS_WORKER_ENABLED=true
      - PENDING_WORKER_ENABLED=true
      - OUTBOX_WORKER_ENABLED=true
    command: ["python", "-m", "demi.worker_entrypoint"]
    volumes:
      - ${HOST_DATA_PATH:-./data}:${CONTAINER_DATA_PATH:-/app/data}
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
