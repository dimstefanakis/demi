[project]
name = "demi"
version = "0.1.0"
description = "Telegram-first chat agent for building and editing SMB websites"
readme = "PRD.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.8",
  "claude-agent-sdk>=0.1.0",
  "supabase>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]
db = [
  "psycopg[binary]>=3.1",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
